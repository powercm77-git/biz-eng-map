<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>업종별 영어 대화 지도</title>
<style>
  :root {
    --primary: #2E6FF2;
    --primary-dark: #1E4FBF;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --ink: #1B2430;
    --sub: #6B7684;
    --line: #E4E8EE;
    --accent: #FF8A3D;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  /* ---------- Layout: mobile = stacked column, desktop = sidebar + map ---------- */
  .layout {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh; /* 모바일 주소창·내비게이션을 뺀 실제 화면 높이 */
    background: var(--card);
    display: flex;
    flex-direction: column;
  }
  .sidebar { display: flex; flex-direction: column; }

  @media (min-width: 900px) {
    .layout { max-width: none; margin: 0; height: 100vh; height: 100dvh; flex-direction: row; overflow: hidden; }
    .sidebar { width: 380px; flex: none; height: 100%; overflow-y: auto; border-right: 1px solid var(--line); }
    #map-wrap { flex: 1; height: 100%; min-height: auto; }
  }

  header {
    background: var(--primary);
    color: #fff;
    padding: 14px 18px 10px;
  }
  .title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: nowrap; }
  .title-left { font-size: 17px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title-right { font-size: 12.5px; opacity: 0.9; white-space: nowrap; flex: none; }
  @media (max-width: 380px) {
    .title-left { font-size: 14px; }
    .title-right { font-size: 10.5px; }
  }
  .subtitle { display: none; font-size: 12.5px; opacity: 0.9; margin-top: 4px; }
  @media (min-width: 900px) {
    .subtitle { display: block; }
    .title-left { font-size: 14px; }
    .title-right { font-size: 10.5px; }
  }

  .category-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .cat-row { display: flex; gap: 8px; overflow-x: auto; flex: 1; min-width: 0; }
  .cat-chip {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--sub);
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-chip.active { border-color: var(--primary); color: var(--primary); background: #EEF3FF; }

  .cat-more-btn {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 6px 12px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--sub);
    cursor: pointer;
  }
  .cat-more-btn .cat-ic { font-size: 16px; line-height: 1; }
  .cat-more-btn.open { border-color: var(--primary); color: var(--primary); background: #EEF3FF; }

  .cat-panel {
    max-height: 0;
    overflow: hidden;
    border-bottom: 0 solid var(--line);
    background: var(--card);
    transition: max-height 0.2s ease;
    flex-shrink: 0;
  }
  .cat-panel.open { max-height: 400px; border-bottom-width: 1px; overflow-y: auto; }

  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 12px 8px; }
  .cat-grid-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 2px;
    border-radius: 12px;
    border: none;
    background: none;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .cat-grid-ic {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid var(--line);
    font-size: 17px;
  }
  .cat-grid-item.active .cat-grid-ic { border-color: var(--primary); background: #EEF3FF; }
  .cat-grid-item.active { color: var(--primary); }
  .cat-grid-item:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 검색·내위치·지도·위성을 한 줄에: 지도 위에 떠다니는 컨트롤 대신 항상 보이는 툴바 */
  .toolbar-wrap { position: relative; border-bottom: 1px solid var(--line); }
  .toolbar { display: flex; gap: 6px; padding: 8px 14px; }
  .tool-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 7px 2px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: #fff;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--sub);
    cursor: pointer;
    font-family: inherit;
  }
  .tool-btn .ic { font-size: 15px; }
  .tool-btn.active { border-color: var(--primary); color: var(--primary); background: #EEF3FF; }

  .region-search {
    display: none;
    position: absolute;
    top: 100%;
    left: 14px;
    right: 14px;
    margin-top: 6px;
    gap: 8px;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.14);
    z-index: 6;
  }
  .region-search.open { display: flex; }
  .region-search input {
    flex: 1;
    min-width: 0;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .region-search button {
    border: none;
    background: var(--primary);
    color: #fff;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 15px;
    cursor: pointer;
  }

  .results-list { display: none; }
  .result-item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .result-item:hover { background: #FAFBFD; }
  .result-name { font-size: 13.5px; font-weight: 700; }
  .result-addr { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
  @media (min-width: 900px) {
    .results-list { display: block; flex: 1; }
  }

  #map-wrap { position: relative; flex: 1; min-height: 340px; }
  #map { position: absolute; inset: 0; }

  .map-hint {
    padding: 8px 14px;
    font-size: 12.5px;
    color: var(--sub);
    border-bottom: 1px solid var(--line);
    background: var(--card);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .map-hint-help { color: #9AA3AF; }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20,26,34,0.45);
    z-index: 20;
    display: none;
  }
  .sheet-overlay.open { display: block; }
  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    z-index: 21;
    display: flex;
    flex-direction: column;
    transition: transform 0.28s ease;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.18);
  }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet-handle { width: 40px; height: 4px; background: var(--line); border-radius: 2px; margin: 10px auto 6px; flex: none; }
  .sheet-head { padding: 4px 18px 12px; border-bottom: 1px solid var(--line); flex: none; }
  .sheet-place-name { font-size: 16.5px; font-weight: 800; }
  .sheet-place-addr { font-size: 12.5px; color: var(--sub); margin-top: 3px; }
  .sheet-close { position: absolute; right: 14px; top: 14px; background: none; border: none; font-size: 20px; color: var(--sub); cursor: pointer; }

  .sheet-tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
  .tab-btn {
    flex: 1;
    padding: 11px;
    background: none;
    border: none;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--sub);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  .tab-panel { flex: 1; overflow-y: auto; }
  .tab-panel.hidden { display: none; }

  .direction-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 14px;
    padding: 12px;
    background: var(--primary);
    color: #fff;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
  }
  .direction-btn.secondary {
    margin-top: -6px;
    background: #fff;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }

  .info-row { padding: 0 14px 14px; font-size: 13px; color: var(--sub); }

  .lib-seats { margin: 0 14px 14px; padding: 12px; background: #F5F3FF; border: 1px solid #DCD3FA; border-radius: 12px; }
  .lib-seats-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; color: #5B3FC7; }
  .lib-seat-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 6px 0; border-top: 1px solid #E7E1FA; }
  .lib-seat-row:first-child { border-top: none; }
  .lib-seat-empty { font-size: 13px; color: var(--sub); }
  .lib-seat-time { font-size: 11px; color: var(--sub); margin-bottom: 6px; }

  #roadview { width: 100%; height: 280px; background: #eee; }
  .roadview-empty { display: none; padding: 40px 20px; text-align: center; color: var(--sub); font-size: 13px; }
  .roadview-empty.show { display: block; }

  .scene-list { padding: 10px 14px 18px; }
  .scene-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .scene-item-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    cursor: pointer;
    background: #FAFBFD;
  }
  .scene-title-ko { font-size: 14px; font-weight: 700; }
  .scene-title-en { font-size: 11.5px; color: var(--sub); margin-top: 2px; }
  .scene-arrow { font-size: 12px; color: var(--sub); transition: transform 0.2s ease; }
  .scene-item.open .scene-arrow { transform: rotate(180deg); }

  .scene-body { display: none; padding: 4px 14px 14px; }
  .scene-item.open .scene-body { display: block; }

  .line { display: flex; gap: 8px; margin-bottom: 10px; }
  .line .who {
    flex: none;
    width: 44px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    border-radius: 8px;
    padding: 4px 0;
    height: fit-content;
  }
  .line.clerk .who { background: var(--primary); }
  .line.customer .who { background: var(--accent); }
  .line .bubble { flex: 1; }
  .line .en-row { display: flex; align-items: center; gap: 6px; }
  .line .en { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .speak-btn {
    flex: none;
    border: none;
    background: #EEF2FF;
    color: var(--primary);
    cursor: pointer;
    font-size: 13px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .speak-btn:active { transform: scale(0.92); }
  .line .pron { font-size: 12.5px; color: var(--primary); margin-top: 2px; line-height: 1.4; }
  .line .ko { font-size: 12.5px; color: var(--sub); margin-top: 2px; line-height: 1.4; }

  .translate-overlay { position: fixed; inset: 0; background: rgba(20,26,34,0.45); z-index: 30; display: none; }
  .translate-overlay.open { display: block; }
  .translate-modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: calc(100% - 32px); max-width: 420px;
    background: var(--card); border-radius: 18px; padding: 18px;
    z-index: 31; display: none;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .translate-modal.open { display: block; }
  .translate-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .translate-title { font-size: 16px; font-weight: 800; }
  .translate-close { border: none; background: none; font-size: 18px; cursor: pointer; color: var(--sub); padding: 4px; }
  .translate-input-wrap { position: relative; }
  .translate-input {
    width: 100%; min-height: 70px; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px; padding-right: 44px; font-size: 14px; font-family: inherit; resize: vertical;
  }
  .translate-mic-btn {
    position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px;
    border-radius: 50%; border: none; background: #EEF2FF; color: var(--primary);
    font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .translate-mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .translate-mic-btn.listening { background: #FFEAEA; color: #D14343; animation: translateMicPulse 1s ease-in-out infinite; }
  @keyframes translateMicPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  .translate-mic-hint { font-size: 11.5px; color: var(--sub); margin-top: 6px; }
  .translate-mic-hint.error { color: #D14343; }
  .translate-lang-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .translate-lang-field { flex: 1; min-width: 0; }
  .translate-lang-field label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 3px; }
  .translate-lang-field select {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 8px 6px; font-size: 12.5px; font-family: inherit; color: var(--ink); background: #fff;
  }
  .translate-go-btn {
    margin-top: 10px; width: 100%; background: var(--primary); color: #fff; border: none;
    border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .translate-go-btn:disabled { opacity: 0.6; cursor: default; }
  .translate-result { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .translate-block + .translate-block { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .translate-ko-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
  .translate-block .ko { font-size: 15px; font-weight: 700; }
  .translate-block .ko.failed, .translate-block .en.failed { font-size: 12.5px; font-weight: 500; color: #D14343; }
  .translate-note { font-size: 11px; color: var(--sub); margin-top: 8px; }
  .translate-error { font-size: 13px; color: #D14343; margin-top: 10px; }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="layout" id="layout">
  <aside class="sidebar">
    <header>
      <div class="title-row">
        <span class="title-left">실전영어회화!-AI 취업역량강화</span>
        <span class="title-right">IT융합컴퓨터과 송정호</span>
      </div>
      <div class="subtitle">지도에서 가게를 선택하면, 그 자리에서 쓸 수 있는 영어 대화가 나옵니다</div>
    </header>

    <div class="category-bar" id="categoryBar">
      <div class="cat-row" id="catRow">
        <button class="cat-chip active" data-cat="CS2">🏪 편의점</button>
        <button class="cat-chip" data-cat="CE7">☕ 카페</button>
        <button class="cat-chip" data-cat="FD6">🍽️ 음식점</button>
        <button class="cat-chip" data-cat="OL7">⛽ 주유소</button>
        <button class="cat-chip" data-cat="LIB">📚 도서관</button>
        <button class="cat-chip" data-cat="HP8">🏥 병원</button>
        <button class="cat-chip" data-cat="PM9">💊 약국</button>
        <button class="cat-chip" data-cat="MT1">🛒 대형마트</button>
        <button class="cat-chip" data-cat="BK9">🏦 은행</button>
        <button class="cat-chip" data-cat="PK6">🅿️ 주차장</button>
        <button class="cat-chip" data-cat="AD5">🏨 숙박</button>
        <button class="cat-chip" data-cat="SW8">🚇 지하철</button>
        <button class="cat-chip" data-cat="CT1">🎭 문화시설</button>
        <button class="cat-chip" data-cat="SC4">🏫 학교</button>
        <button class="cat-chip" data-cat="PS3">🧸 어린이집</button>
        <button class="cat-chip" data-cat="OFC">🏢 회사</button>
      </div>
      <button class="cat-more-btn" id="catMoreBtn"><span class="cat-ic">⋯</span><span>주변</span></button>
    </div>
    <div class="cat-panel" id="catPanel">
      <div class="cat-grid" id="catGrid">
        <button class="cat-grid-item active" data-cat="CS2"><span class="cat-grid-ic">🏪</span>편의점</button>
        <button class="cat-grid-item" data-cat="CE7"><span class="cat-grid-ic">☕</span>카페</button>
        <button class="cat-grid-item" data-cat="FD6"><span class="cat-grid-ic">🍽️</span>음식점</button>
        <button class="cat-grid-item" data-cat="OL7"><span class="cat-grid-ic">⛽</span>주유소</button>
        <button class="cat-grid-item" data-cat="LIB"><span class="cat-grid-ic">📚</span>도서관</button>
        <button class="cat-grid-item" data-cat="HP8"><span class="cat-grid-ic">🏥</span>병원</button>
        <button class="cat-grid-item" data-cat="PM9"><span class="cat-grid-ic">💊</span>약국</button>
        <button class="cat-grid-item" data-cat="MT1"><span class="cat-grid-ic">🛒</span>대형마트</button>
        <button class="cat-grid-item" data-cat="BK9"><span class="cat-grid-ic">🏦</span>은행</button>
        <button class="cat-grid-item" data-cat="PK6"><span class="cat-grid-ic">🅿️</span>주차장</button>
        <button class="cat-grid-item" data-cat="AD5"><span class="cat-grid-ic">🏨</span>숙박</button>
        <button class="cat-grid-item" data-cat="SW8"><span class="cat-grid-ic">🚇</span>지하철</button>
        <button class="cat-grid-item" data-cat="CT1"><span class="cat-grid-ic">🎭</span>문화시설</button>
        <button class="cat-grid-item" data-cat="SC4"><span class="cat-grid-ic">🏫</span>학교</button>
        <button class="cat-grid-item" data-cat="PS3"><span class="cat-grid-ic">🧸</span>어린이집</button>
        <button class="cat-grid-item" data-cat="OFC"><span class="cat-grid-ic">🏢</span>회사</button>
      </div>
    </div>

    <div class="toolbar-wrap">
      <div class="toolbar">
        <button class="tool-btn" id="searchToggleBtn" title="지역 검색"><span class="ic">🔍</span><span>검색</span></button>
        <button class="tool-btn" id="locateBtn" title="내 위치로 이동"><span class="ic">📍</span><span>내위치</span></button>
        <button class="tool-btn active" id="roadmapBtn" title="일반 지도"><span class="ic">🗺️</span><span>지도</span></button>
        <button class="tool-btn" id="skyviewBtn" title="위성 지도"><span class="ic">🛰️</span><span>위성</span></button>
        <button class="tool-btn" id="translateToggleBtn" title="즉석 번역"><span class="ic">💬</span><span>번역</span></button>
      </div>
      <div class="region-search" id="regionSearchBox">
        <input type="text" id="regionInput" placeholder="지역·주소 검색 (예: 평택시청)">
        <button id="regionSearchBtn">검색</button>
      </div>
    </div>

    <div class="map-hint">
      <span id="mapHintText">현재 위치 주변 편의점을 찾고 있습니다…</span>
      <span class="map-hint-help">· 마커 눌러 확인</span>
    </div>

    <div class="results-list" id="resultsList"></div>
  </aside>

  <div id="map-wrap">
    <div id="map"></div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose">✕</button>
  <div class="sheet-head">
    <div class="sheet-place-name" id="placeName">편의점</div>
    <div class="sheet-place-addr" id="placeAddr"></div>
  </div>

  <div class="sheet-tabs">
    <button class="tab-btn active" data-tab="info">정보</button>
    <button class="tab-btn" data-tab="roadview">로드뷰</button>
    <button class="tab-btn" data-tab="dialogue">대화</button>
  </div>

function buildMarkerImage(catCode) {
  const meta = CATEGORY_ICON[catCode] || { emoji: "📍", color: "#2E6FF2" };
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="36" height="44" viewBox="0 0 36 44">
    <path d="M18 0C8 0 0 8 0 18c0 13 18 26 18 26s18-13 18-26C36 8 28 0 18 0z" fill="${meta.color}"/>
    <circle cx="18" cy="17" r="12.5" fill="#fff"/>
    <text x="18" y="23" font-size="15" text-anchor="middle">${meta.emoji}</text>
  </svg>`;
  return new kakao.maps.MarkerImage(
    "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg),
    new kakao.maps.Size(36, 44),
    { offset: new kakao.maps.Point(18, 44) }
  );
}

function setMyLocationMarker(center) {
  const position = new kakao.maps.LatLng(center.lat, center.lng);
  if (myLocationMarker) {
    myLocationMarker.setPosition(position);
    return;
  }
  myLocationMarker = new kakao.maps.Marker({
    map,
    position,
    zIndex: 10,
    image: new kakao.maps.MarkerImage(
      "data:image/svg+xml;base64," + btoa('<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"><circle cx="9" cy="9" r="7" fill="#2E6FF2" stroke="#fff" stroke-width="3"/></svg>'),
      new kakao.maps.Size(18, 18)
    )
  });
}

function initMap(center) {
  const container = document.getElementById("map");
  map = new kakao.maps.Map(container, {
    center: new kakao.maps.LatLng(center.lat, center.lng),
    level: 4
  });
  placesService = new kakao.maps.services.Places();
  geocoder = new kakao.maps.services.Geocoder();

  // 카카오맵은 flex 레이아웃으로 컨테이너 높이가 늦게 확정되면 초기 크기로 굳어버린다.
  // 레이아웃이 안정된 뒤 한 번 더 relayout해서 실제 컨테이너 크기에 맞춘다.
  requestAnimationFrame(() => {
    map.relayout();
    map.setCenter(new kakao.maps.LatLng(center.lat, center.lng));
  });
  window.addEventListener("resize", () => map.relayout());

  setMyLocationMarker(center);

  searchNearby(center, currentCat);

  kakao.maps.event.addListener(map, "idle", () => {
    const c = map.getCenter();
    searchNearby({ lat: c.getLat(), lng: c.getLng() }, currentCat);
  });
}

function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
}

function searchNearby(center, catCode) {
  document.getElementById("mapHintText").textContent = `${CATEGORY_LABEL[catCode]} 찾는 중…`;

  const handleResults = (results, status) => {
    if (status !== kakao.maps.services.Status.OK || !results.length) {
      document.getElementById("mapHintText").textContent = "주변에서 찾지 못했습니다. 지도를 움직여보세요.";
      clearMarkers();
      renderResultsList([], catCode);
      return;
    }
    clearMarkers();
    const limited = results.slice(0, 15);
    limited.forEach(place => {
      const marker = new kakao.maps.Marker({
        map,
        position: new kakao.maps.LatLng(place.y, place.x),
        image: buildMarkerImage(catCode)
      });
      kakao.maps.event.addListener(marker, "click", () => openSheet(place, catCode));
      markers.push(marker);
    });
    renderResultsList(limited, catCode);
    document.getElementById("mapHintText").textContent = `주변 ${CATEGORY_LABEL[catCode]} ${limited.length}곳 표시됨`;
  };

  const location = new kakao.maps.LatLng(center.lat, center.lng);
  if (catCode === "LIB") {
    // 도서관은 표준 카테고리 코드가 없어 키워드 검색 후 도서관 분류만 골라낸다.
    placesService.keywordSearch("도서관", (data, status) => {
      const filtered = status === kakao.maps.services.Status.OK
        ? data.filter(p => p.category_name && p.category_name.includes("도서관"))
        : [];
      handleResults(filtered, filtered.length ? kakao.maps.services.Status.OK : kakao.maps.services.Status.ZERO_RESULT);
    }, { location, radius: 1200 });
  } else if (catCode === "OFC") {
    // 회사도 표준 카테고리 코드가 없어 키워드 검색으로 대신한다.
    placesService.keywordSearch("회사", handleResults, { location, radius: 1200, size: 15 });
  } else {
    placesService.categorySearch(catCode, handleResults, { location, radius: 1200, size: 15 });
  }
}

function renderResultsList(results, catCode) {
  const list = document.getElementById("resultsList");
  list.innerHTML = "";
  results.forEach(place => {
    const item = document.createElement("div");
    item.className = "result-item";
    item.innerHTML = `
      <div class="result-name">${place.place_name}</div>
      <div class="result-addr">${place.road_address_name || place.address_name || ""}</div>
    `;
    item.addEventListener("click", () => {
      map.setCenter(new kakao.maps.LatLng(place.y, place.x));
      openSheet(place, catCode);
    });
    list.appendChild(item);
  });
}

function searchRegion(query) {
  if (!query || !query.trim()) return;
  document.getElementById("mapHintText").textContent = "지역 검색 중…";
  geocoder.addressSearch(query, (result, status) => {
    if (status === kakao.maps.services.Status.OK && result[0]) {
      map.setCenter(new kakao.maps.LatLng(parseFloat(result[0].y), parseFloat(result[0].x)));
      return;
    }
    placesService.keywordSearch(query, (data, kstatus) => {
      if (kstatus === kakao.maps.services.Status.OK && data[0]) {
        map.setCenter(new kakao.maps.LatLng(parseFloat(data[0].y), parseFloat(data[0].x)));
      } else {
        document.getElementById("mapHintText").textContent = "검색 결과가 없습니다. 다른 지역명으로 시도해보세요.";
      }
    });
  });
}

function setMapType(type) {
  if (!map) return;
  map.setMapTypeId(type === "skyview" ? kakao.maps.MapTypeId.SKYVIEW : kakao.maps.MapTypeId.ROADMAP);
  document.getElementById("roadmapBtn").classList.toggle("active", type === "roadmap");
  document.getElementById("skyviewBtn").classList.toggle("active", type === "skyview");
}
document.getElementById("roadmapBtn").addEventListener("click", () => setMapType("roadmap"));
document.getElementById("skyviewBtn").addEventListener("click", () => setMapType("skyview"));

function closeCatPanel() {
  document.getElementById("catPanel").classList.remove("open");
  document.getElementById("catMoreBtn").classList.remove("open");
}

function selectCategory(catCode) {
  closeCatPanel();
  if (catCode === currentCat) return;
  currentCat = catCode;
  document.querySelectorAll(".cat-chip, .cat-grid-item").forEach(b => {
    b.classList.toggle("active", b.dataset.cat === catCode);
  });
  if (map) {
    const c = map.getCenter();
    searchNearby({ lat: c.getLat(), lng: c.getLng() }, currentCat);
  }
}

document.querySelectorAll(".cat-chip, .cat-grid-item:not([disabled])").forEach(btn => {
  btn.addEventListener("click", () => selectCategory(btn.dataset.cat));
});

document.getElementById("catMoreBtn").addEventListener("click", () => {
  const panel = document.getElementById("catPanel");
  const btn = document.getElementById("catMoreBtn");
  const willOpen = !panel.classList.contains("open");
  panel.classList.toggle("open", willOpen);
  btn.classList.toggle("open", willOpen);
});

function buildDirectionUrl(place) {
  return `https://map.kakao.com/link/to/${encodeURIComponent(place.place_name)},${place.y},${place.x}`;
}

function switchTab(tabName) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tabName));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("hidden", p.id !== `tab-${tabName}`));
  if (tabName === "roadview") loadRoadview(currentSheetPlace);
}
document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));

function loadRoadview(place) {
  if (!place) return;
  const key = `${place.x},${place.y}`;
  if (roadviewLoadedForKey === key) return;
  roadviewLoadedForKey = key;

  const container = document.getElementById("roadview");
  const emptyMsg = document.getElementById("roadviewEmpty");
  container.classList.remove("hidden");
  emptyMsg.classList.remove("show");

  if (!roadviewInstance) roadviewInstance = new kakao.maps.Roadview(container);
  const roadviewClient = new kakao.maps.RoadviewClient();
  const position = new kakao.maps.LatLng(place.y, place.x);
  roadviewClient.getNearestPanoId(position, 50, panoId => {
    if (panoId === null) {
      container.classList.add("hidden");
      emptyMsg.classList.add("show");
      return;
    }
    roadviewInstance.setPanoId(panoId, position);
  });
}

// data/lib-index.json, data/lib-seats.json으로 스냅샷을 남기고,
// 여기서는 같은 오리진의 그 파일을 읽는다(20분 간격 갱신, 완전한 실시간은 아님).
let libraryIndexPromise = null;
function fetchLibraryIndex() {
  if (!libraryIndexPromise) {
    libraryIndexPromise = fetch("data/lib-index.json")
      .then(res => res.json())
      .then(data => data.items || [])
      .catch(() => []);
  }
  return libraryIndexPromise;
}

let librarySeatsPromise = null;
function fetchLibrarySeatSnapshot() {
  if (!librarySeatsPromise) {
    librarySeatsPromise = fetch("data/lib-seats.json")
      .then(res => res.json())
      .catch(() => ({ generatedAt: null, items: [] }));
  }
  return librarySeatsPromise;
}

function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

async function findMatchingLibrary(place) {
  const index = await fetchLibraryIndex();
  const placeLat = parseFloat(place.y);
  const placeLng = parseFloat(place.x);
  let best = null;
  let bestDist = Infinity;
  index.forEach(lib => {
    const d = distanceMeters(placeLat, placeLng, parseFloat(lib.lat), parseFloat(lib.lot));
    if (d < bestDist) {
      bestDist = d;
      best = lib;
    }
  });
  return best && bestDist <= 400 ? best : null;
}

async function fetchLibrarySeatRows(lib) {
  const snapshot = await fetchLibrarySeatSnapshot();
  // pblibId는 전국 고유값이 아니라 지역(stdgCd)별로 재사용되는 번호라
  // stdgCd까지 같이 맞아야 같은 도서관이다.
  const rows = (snapshot.items || []).filter(
    r => r.pblibId === lib.pblibId && r.stdgCd === lib.stdgCd
  );
  return { rows, generatedAt: snapshot.generatedAt };
}

function formatSnapshotTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  const pad = n => String(n).padStart(2, "0");
  return `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} 기준`;
}

let libSeatRequestToken = 0;
async function loadLibrarySeatInfo(place) {
  const panel = document.getElementById("libSeats");
  const body = document.getElementById("libSeatsBody");
  panel.classList.remove("hidden");
  body.innerHTML = `<div class="lib-seat-empty">좌석 정보 불러오는 중…</div>`;
  const token = ++libSeatRequestToken;

  const lib = await findMatchingLibrary(place);
  if (token !== libSeatRequestToken) return;
  if (!lib) {
    body.innerHTML = `<div class="lib-seat-empty">이 도서관은 잔여 좌석 정보가 제공되지 않습니다.</div>`;
    return;
  }

  let rows = [];
  let generatedAt = null;
  try {
    ({ rows, generatedAt } = await fetchLibrarySeatRows(lib));
  } catch (e) {
    rows = [];
  }
  if (token !== libSeatRequestToken) return;
  if (!rows.length) {
    body.innerHTML = `<div class="lib-seat-empty">잔여 좌석 정보가 없습니다.</div>`;
    return;
  }
  const timeLabel = formatSnapshotTime(generatedAt);
  body.innerHTML =
    (timeLabel ? `<div class="lib-seat-time">${timeLabel}</div>` : "") +
    rows
      .map(
        r => `
    <div class="lib-seat-row">
      <span>${r.rdrmNm}${r.bldgFlrExpln ? ` (${r.bldgFlrExpln})` : ""}</span>
      <span><b>${r.rmndSeatCnt || "-"}</b> / ${r.tseatCnt || "-"}석 남음</span>
    </div>`
      )
      .join("");
}

function escAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
}

function speakEnglish(text) {
  if (!text || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.63;
  speechSynthesis.speak(utter);
}

function locateUser(recenter) {
  if (!navigator.geolocation) {
    if (!map) initMap(DEFAULT_CENTER);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const center = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!map) {
        initMap(center);
      } else {
        setMyLocationMarker(center);
        if (recenter) map.setCenter(new kakao.maps.LatLng(center.lat, center.lng));
      }
    },
    () => {
      if (!map) initMap(DEFAULT_CENTER);
    },
    { timeout: 5000 }
  );
}

function transliterateWord(rawWord) {
  const clean = rawWord.toLowerCase().replace(/[^a-z']/g, "");
  if (!clean) return "";
  if (PRON_WORD_DICT[clean]) return PRON_WORD_DICT[clean];
  // 사전에 없으면 복수형(-s, -es)을 벗겨서 한 번 더 찾아본다.
  if (clean.endsWith("es") && PRON_WORD_DICT[clean.slice(0, -2)]) return PRON_WORD_DICT[clean.slice(0, -2)] + "즈";
  if (clean.endsWith("s") && PRON_WORD_DICT[clean.slice(0, -1)]) return PRON_WORD_DICT[clean.slice(0, -1)] + "즈";

  const DIGRAPHS = [
    [/tion$/, "션"], [/sion$/, "젼"],
    [/ight/g, "아이트"], [/ough/g, "오"], [/augh/g, "애프"], [/eigh/g, "에이"],
    [/dge/g, "지"], [/tch/g, "치"], [/ck/g, "크"], [/qu/g, "쿠"],
    [/ch/g, "치"], [/sh/g, "쉬"], [/th/g, "쓰"], [/ph/g, "프"], [/wh/g, "워"], [/ng/g, "응"],
    [/ee/g, "이"], [/ea/g, "이"], [/oo/g, "우"], [/ou/g, "아우"], [/ow/g, "오우"],
    [/ay/g, "에이"], [/ai/g, "에이"], [/oy/g, "오이"], [/oi/g, "오이"],
    [/au/g, "오"], [/aw/g, "오"],
    [/er/g, "어"], [/ir/g, "어"], [/ur/g, "어"], [/ar/g, "아"], [/or/g, "오"],
    [/a/g, "아"], [/e/g, "에"], [/i/g, "이"], [/o/g, "오"], [/u/g, "어"], [/y/g, "이"],
    [/b/g, "브"], [/c/g, "크"], [/d/g, "드"], [/f/g, "프"], [/g/g, "그"], [/h/g, "흐"],
    [/j/g, "즈"], [/k/g, "크"], [/l/g, "르"], [/m/g, "므"], [/n/g, "느"], [/p/g, "프"],
    [/r/g, ""], [/s/g, "스"], [/t/g, "트"], [/v/g, "브"], [/w/g, "우"], [/x/g, "스"], [/z/g, "즈"]
  ];

  let result = clean.replace(/'/g, "");
  for (const [pattern, replacement] of DIGRAPHS) {
    result = result.replace(pattern, replacement);
  }
  return result;
}

function guessKoreanPronunciation(englishText) {
  return englishText
    .split(/\s+/)
    .map(token => {
      const trailingPunct = (token.match(/[.,!?]+$/) || [""])[0];
      const core = token.slice(0, token.length - trailingPunct.length);
      return transliterateWord(core) + trailingPunct;
    })
    .filter(Boolean)
    .join(" ");
}

function syncTranslateOutModeOptions() {
  const isKo = translateSrcLang.value === "ko";
  const isEn = translateSrcLang.value === "en";
  translateOutMode.querySelector('option[value="ko"]').disabled = isKo;
  translateOutMode.querySelector('option[value="en"]').disabled = isEn;
  translateOutMode.querySelector('option[value="both"]').disabled = isKo || isEn;
  if (isKo && translateOutMode.value !== "en") translateOutMode.value = "en";
  if (isEn && translateOutMode.value !== "ko") translateOutMode.value = "ko";
}
translateSrcLang.addEventListener("change", syncTranslateOutModeOptions);
syncTranslateOutModeOptions();

async function fetchGoogleTranslation(text, sourceLang, targetLang) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("google http " + res.status);
  const data = await res.json();
  const result = data && data[0] ? data[0].map(seg => seg[0]).join("") : "";
  if (!result) throw new Error("google empty result");
  return result;
}

async function fetchMyMemoryTranslation(text, sourceLang, targetLang) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sourceLang}|${targetLang}`;
  const res = await fetch(url);
  const data = await res.json();
  const result = data && data.responseData && data.responseData.translatedText;
  if (!result) throw new Error("mymemory empty result");
  return result;
}

// 품질이 더 좋은 구글 번역을 우선 쓰고, 막히면(비공식 API라 언제든 막힐 수 있음) MyMemory로 대체
async function translateText(text, sourceLang, targetLang) {
  try {
    return await fetchGoogleTranslation(text, sourceLang, targetLang);
  } catch (e) {
    return await fetchMyMemoryTranslation(text, sourceLang, targetLang);
  }
}

function containsHangul(str) {
  return /[가-힣]/.test(str);
}
function containsLatin(str) {
  return /[a-zA-Z]/.test(str);
}
const TRANSLATE_KO_FAILED_MSG = "⚠️ 이 문장은 한국어로 정확히 변환되지 않았어요. 표현을 바꿔서 다시 시도해보세요.";
const TRANSLATE_EN_FAILED_MSG = "이 문장은 영어로 정확히 변환되지 않았어요. 표현을 바꿔서 다시 시도해보세요.";

translateGoBtn.addEventListener("click", async () => {
  const text = translateInput.value.trim();
  if (!text) return;

  const srcLang = translateSrcLang.value;
  const outMode = translateOutMode.value;
  const wantEn = (outMode === "both" || outMode === "en") && srcLang !== "en";
  const wantKo = (outMode === "both" || outMode === "ko") && srcLang !== "ko";

  translateError.classList.add("hidden");
  translateResult.classList.add("hidden");
  translateEnBlock.classList.add("hidden");
  translateKoBlock.classList.add("hidden");
  translateGoBtn.disabled = true;
  translateGoBtn.textContent = "변환 중…";

  // 둘 다 요청했을 때 한쪽이 실패해도 나머지 한쪽은 보여주기 위해 allSettled 사용
  const [enResult, koResult] = await Promise.allSettled([
    wantEn ? translateText(text, srcLang, "en") : Promise.resolve(null),
    wantKo ? translateText(text, srcLang, "ko") : Promise.resolve(null)
  ]);

  const en = enResult.status === "fulfilled" ? enResult.value : null;
  const ko = koResult.status === "fulfilled" ? koResult.value : null;
  let shownAny = false;

  if (wantEn) {
    const enOk = en && containsLatin(en);
    translateEn.textContent = enOk ? en : TRANSLATE_EN_FAILED_MSG;
    translateEn.classList.toggle("failed", !enOk);
    translatePron.textContent = enOk ? guessKoreanPronunciation(en) : "";
    translateEnBlock.classList.remove("hidden");
    shownAny = true;
  }
  if (wantKo) {
    const koOk = ko && containsHangul(ko);
    translateKo.textContent = koOk ? ko : TRANSLATE_KO_FAILED_MSG;
    translateKo.classList.toggle("failed", !koOk);
    translateKoBlock.classList.remove("hidden");
    shownAny = true;
  }

  if (shownAny) {
    translateResult.classList.remove("hidden");
  } else {
    translateError.textContent = "번역에 실패했습니다. 잠시 후 다시 시도해주세요.";
    translateError.classList.remove("hidden");
  }
  translateGoBtn.disabled = false;
  translateGoBtn.textContent = "변환하기";
});

// 음성 입력(마이크) — 브라우저 내장 Web Speech API, 지원 안 되면 버튼 비활성화
const translateMicBtn = document.getElementById("translateMicBtn");
const translateMicHint = document.getElementById("translateMicHint");
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
const TRANSLATE_SPEECH_LANG = {
  ko: "ko-KR", en: "en-US", vi: "vi-VN", zh: "zh-CN", tl: "fil-PH", th: "th-TH",
  mn: "mn-MN", ru: "ru-RU", km: "km-KH", uz: "uz-UZ", ne: "ne-NP", ja: "ja-JP"
};

if (!SpeechRecognitionCtor) {
  translateMicBtn.disabled = true;
  translateMicBtn.title = "이 브라우저는 음성 입력을 지원하지 않습니다";
} else {
  let recognizer = null;
  let isListening = false;

  function showMicHint(msg, isError) {
    translateMicHint.textContent = msg;
    translateMicHint.classList.toggle("error", !!isError);
    translateMicHint.classList.toggle("hidden", !msg);
  }

  translateMicBtn.addEventListener("click", () => {
    if (isListening) {
      recognizer && recognizer.stop();
      return;
    }
    showMicHint("", false);
    recognizer = new SpeechRecognitionCtor();
    recognizer.lang = TRANSLATE_SPEECH_LANG[translateSrcLang.value] || "ko-KR";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onstart = () => {
      isListening = true;
      translateMicBtn.classList.add("listening");
      showMicHint("듣고 있어요…", false);
    };
    recognizer.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      translateInput.value = transcript;
      showMicHint("", false);
    };
    recognizer.onerror = (e) => {
      showMicHint("음성 인식에 실패했어요. 이 언어는 지원되지 않을 수 있어요 — 직접 입력해주세요.", true);
    };
    recognizer.onend = () => {
      isListening = false;
      translateMicBtn.classList.remove("listening");
    };
    try {
      recognizer.start();
    } catch (e) {
      showMicHint("음성 인식을 시작할 수 없어요. 직접 입력해주세요.", true);
    }
  });
}

translateSpeakBtn.addEventListener("click", () => {
  speakEnglish(translateEn.textContent);
});

function loadKakaoSdk(appKey) {
  const script = document.createElement("script");
  script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${appKey}&autoload=false&libraries=services`;
  script.onload = () => kakao.maps.load(() => locateUser(false));
  document.head.appendChild(script);
}

loadKakaoSdk("c6f8e6e19945b387fd533e6e8d98735b");
</script>
