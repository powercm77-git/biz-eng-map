name: Update library seat data

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node scripts/fetch-library-data.js
        env:
          LIB_API_KEY: ${{ secrets.LIB_API_KEY }}

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lib-index.json data/lib-seats.json
          git diff --cached --quiet && echo "no changes" || git commit -m "Update library seat snapshot"
          git push
        
